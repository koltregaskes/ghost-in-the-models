name: Chief signature approval gate
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signatures:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate data
        uses: actions/checkout@v7
        with:
          path: candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Require external trust pins
        uses: actions/github-script@v9
        with:
          script: |
            const root = ${{ toJSON(vars.GITM_APPROVAL_ROOT_SHA256) }};
            const verifier = ${{ toJSON(vars.GITM_APPROVAL_VERIFIER_COMMIT) }};
            if (!/^[0-9a-f]{64}$/.test(root) || !/^[0-9a-f]{40}$/.test(verifier)) {
              throw new Error('Chief approval setup incomplete: configure the public root digest and pinned verifier commit outside the repository.');
            }

      - name: Checkout pinned verifier code
        uses: actions/checkout@v7
        with:
          ref: ${{ vars.GITM_APPROVAL_VERIFIER_COMMIT }}
          path: verifier
          persist-credentials: false

      - name: Verify Chief signatures and signer rotation history
        uses: actions/github-script@v9
        with:
          script: |
            const {spawnSync} = require('node:child_process');
            const pin = ${{ toJSON(vars.GITM_APPROVAL_ROOT_SHA256) }};
            const result = spawnSync('python3', ['-I', 'verifier/scripts/verify-approvals.py', '--root', 'candidate', '--trust-root-sha256', pin, '--mode', 'all'], {stdio: 'inherit'});
            if (result.error || result.status !== 0) throw new Error('Chief signature verification failed.');

      - name: Test signed approval attacks using throwaway keys
        working-directory: candidate
        run: python3 scripts/test-approval.py
