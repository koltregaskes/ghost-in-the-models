name: Launch acceptance
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  launch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build and validate static publication
        shell: pwsh
        run: ./scripts/validate-site.ps1
      - run: python3 scripts/check-links.py
      - run: python3 scripts/check-seo.py
      - run: npm run test:routes