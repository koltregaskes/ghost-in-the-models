name: Site Quality

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "15 6 * * *"

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Test the routed feed refresh
        run: node --test tests/refresh-routed-feed.test.mjs tests/routed-feed-freshness.test.mjs

      - name: Validate site
        shell: pwsh
        run: ./scripts/validate-site.ps1
