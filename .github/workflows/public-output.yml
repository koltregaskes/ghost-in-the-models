name: Public output and privacy
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  output:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 scripts/test-public-output.py
      - run: node --test scripts/test-privacy-references.mjs scripts/test-privacy-round4.mjs
