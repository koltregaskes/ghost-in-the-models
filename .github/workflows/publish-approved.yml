name: Prepare Chief-approved publication
# Read-only repository token: no bot push, merge or account assertion is approval.
on:
  schedule:
    - cron: "20 * * * *"
  workflow_dispatch:
    inputs:
      ignore_window:
        description: "Prepare a signed candidate outside the UK morning window"
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: publish-approved
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate data
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Require external trust pins
        uses: actions/github-script@v9
        with:
          script: |
            const root = ${{ toJSON(vars.GITM_APPROVAL_ROOT_SHA256) }};
            const verifier = ${{ toJSON(vars.GITM_APPROVAL_VERIFIER_COMMIT) }};
            if (!/^[0-9a-f]{64}$/.test(root) || !/^[0-9a-f]{40}$/.test(verifier)) {
              throw new Error('Chief approval setup incomplete: configure the public root digest and pinned verifier commit outside the repository.');
            }

      - name: Checkout pinned verifier code
        uses: actions/checkout@v7
        with:
          ref: ${{ vars.GITM_APPROVAL_VERIFIER_COMMIT }}
          path: verifier
          persist-credentials: false

      - name: Verify Chief signatures and signer rotation history
        uses: actions/github-script@v9
        with:
          script: |
            const {spawnSync} = require('node:child_process');
            const pin = ${{ toJSON(vars.GITM_APPROVAL_ROOT_SHA256) }};
            const result = spawnSync('python3', ['-I', 'verifier/scripts/verify-approvals.py', '--root', 'candidate', '--trust-root-sha256', pin, '--mode', 'all'], {stdio: 'inherit'});
            if (result.error || result.status !== 0) throw new Error('Chief signature verification failed.');

      - name: Prepare one signed candidate
        id: prepare
        uses: actions/github-script@v9
        with:
          script: |
            const {spawnSync} = require('node:child_process');
            const pin = ${{ toJSON(vars.GITM_APPROVAL_ROOT_SHA256) }};
            const args = ['-I', 'verifier/scripts/publish-approved.py', '--root', 'candidate', '--trust-root-sha256', pin, '--apply'];
            if (${{ toJSON(inputs.ignore_window == true) }}) args.push('--ignore-window');
            const result = spawnSync('python3', args, {encoding: 'utf8'});
            process.stdout.write(result.stdout || '');
            process.stderr.write(result.stderr || '');
            if (result.error || result.status !== 0) throw new Error('Signed preparation failed. Nothing committed or deployed.');
            core.setOutput('prepared', /^PREPARED /m.test(result.stdout || '') ? 'true' : 'false');

      - name: Build the shared allowlisted public artifact
        run: python3 -I verifier/scripts/build-approved-artifact.py --root candidate --output _site

      - name: Verify Chief signatures and signer rotation history
        uses: actions/github-script@v9
        with:
          script: |
            const {spawnSync} = require('node:child_process');
            const pin = ${{ toJSON(vars.GITM_APPROVAL_ROOT_SHA256) }};
            const result = spawnSync('python3', ['-I', 'verifier/scripts/verify-approvals.py', '--root', 'candidate', '--trust-root-sha256', pin, '--mode', 'all', '--artifact', '_site'], {stdio: 'inherit'});
            if (result.error || result.status !== 0) throw new Error('Chief signature verification failed.');

      - name: Retain candidate for the Chief to commit
        if: steps.prepare.outputs.prepared == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: chief-approved-publication-candidate
          if-no-files-found: error
          path: _site

      - name: Record the publication boundary
        if: steps.prepare.outputs.prepared == 'true'
        run: echo "Candidate prepared only. The Chief must commit these exact bytes through the existing agent workflow; the Pages gate verifies signatures again."
