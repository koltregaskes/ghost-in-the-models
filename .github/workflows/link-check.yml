name: Link check

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "30 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Test link and redirect checks
        run: python3 scripts/test-check-links.py

      - name: Check internal and external links
        run: python3 scripts/check-links.py --external
